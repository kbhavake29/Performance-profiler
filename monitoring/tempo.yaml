# Grafana Tempo (single binary, local block storage) for development use.
# Run with -config.expand-env=true; defaults match the Compose deployment.
stream_over_http_enabled: true

server:
  http_listen_port: ${TEMPO_HTTP_PORT:-3200}
  grpc_listen_port: ${TEMPO_GRPC_PORT:-9095}
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: ${TEMPO_OTLP_GRPC_ENDPOINT:-0.0.0.0:4317}
        http:
          endpoint: ${TEMPO_OTLP_HTTP_ENDPOINT:-0.0.0.0:4318}

ingester:
  # Flush traces to blocks quickly so they become searchable soon after a demo.
  max_block_duration: 5m
  trace_idle_period: 5s

compactor:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: local
    wal:
      path: ${TEMPO_DATA_DIR:-/var/tempo}/wal
    local:
      path: ${TEMPO_DATA_DIR:-/var/tempo}/blocks
