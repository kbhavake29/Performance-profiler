# Prometheus scrape configuration for the local stack.
# Service names resolve on the Compose network; scripts/native_stack.sh rewrites
# them to localhost for a Docker-free run.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # Application metrics re-exposed by the collector's Prometheus exporter.
  # honor_labels keeps `job` = OTel service.name and `instance` from the SDKs.
  - job_name: otel-collector-exporter
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  # The collector's own health metrics (accepted/refused spans, queue sizes).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
