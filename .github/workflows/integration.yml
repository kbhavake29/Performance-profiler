name: Integration

# Starts the real Docker Compose stack, runs both demos, and verifies that
# metrics reach Prometheus, traces reach Tempo, and Grafana is provisioned.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "cpp/**"
      - "monitoring/**"
      - "docker-compose.yml"
      - "tests/integration/**"
      - "scripts/**"
      - ".github/workflows/integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt -e ".[dev]"
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libcurl4-openssl-dev libprotobuf-dev protobuf-compiler
      - uses: actions/cache@v4
        with:
          path: build-fetch/_deps
          key: otel-cpp-v1.29.0-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
      - name: Build native demo
        run: |
          cmake --preset fetch -DIPP_BUILD_TESTS=OFF
          cmake --build --preset fetch
      - name: Start stack
        run: |
          docker compose up -d
          WAIT_SECONDS=180 scripts/verify_stack.sh
      - name: Emit telemetry from Python, C++ and CLI demos
        run: BUILD_DIR=build-fetch PY=python scripts/run_demo.sh
      - name: Verify telemetry, dashboards and regression checker
        run: |
          sleep 15
          scripts/verify_stack.sh --telemetry
          python scripts/check_dashboard_queries.py --require-data
          BUILD_DIR=build-fetch pytest tests/integration -m integration -v
      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-logs
          path: compose.log
      - if: always()
        run: docker compose down -v
