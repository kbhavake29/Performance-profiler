name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, config and a minimal code sample. Remove secrets and prompt text.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `inference-profiler doctor`
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, Python version, compiler, opentelemetry-cpp version, Docker version
